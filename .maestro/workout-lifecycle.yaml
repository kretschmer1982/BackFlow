appId: com.kretschmer1982.BackFlow
---
# Test: Workout anlegen, verifizieren und löschen

- launchApp:
    clearState: true

# 1. Onboarding überspringen (falls sichtbar)
- runFlow:
    when:
      visible:
        id: "onboarding-skip"
    commands:
      - tapOn:
          id: "onboarding-skip"

# 2. Neues Workout erstellen
- tapOn:
    id: "home-fab-main"
- tapOn:
    id: "home-fab-create-workout"

# 3. Name eingeben
- tapOn:
    id: "create-title-input"
- inputText: "E2E Test Workout"
- tapOn:
    id: "create-title-confirm"

# 4. Drei Übungen aus der Bibliothek hinzufügen (Index-basiert)
- tapOn:
    id: "create-exercise-0"
- tapOn:
    id: "create-exercise-1"
- tapOn:
    id: "create-exercise-2"

# 5. Speichern
- tapOn:
    id: "create-save-button"

# 6. Verifizieren auf Home Screen (Index-basiert)
- assertVisible:
    id: "home-workout-card-0"
- assertVisible:
    id: "home-workout-name-0"
- assertVisible:
    id: "home-workout-count-0"

# 7. Workout wieder löschen
- tapOn:
    text: "×"
    index: 0

# 8. Löschen im Alert bestätigen
- tapOn: "Löschen"

# 9. Verifizieren, dass es weg ist
- assertNotVisible:
    id: "home-workout-card-0"
