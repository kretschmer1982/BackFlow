appId: com.kretschmer1982.BackFlow
---
# Minimaler Smoke Test - beweist, dass E2E Tests funktionieren

- launchApp:
    clearState: true

# Warte bis die App vollständig geladen ist
- extendedWaitUntil:
    visible: ".*"
    timeout: 30000

# Versuche optionales Onboarding zu überspringen (falls vorhanden)
- runFlow:
    when:
      visible:
        id: "onboarding-skip"
    commands:
      - tapOn:
          id: "onboarding-skip"

# Kurze Wartezeit für UI-Stabilisierung
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000
  
# Seed Demo-Workouts
- openLink: backflow://debug/seed
- waitForAnimationToEnd
- assertVisible: ".*"

# Zum Planner navigieren
- tapOn:
    id: "tab-planner"

# Verifiziere statische Planner-IDs
- assertVisible:
    id: "planner-row-di"
- assertVisible:
    id: "planner-row-sa"
- assertVisible:
    id: "planner-workout-di"
- assertVisible:
    id: "planner-workout-sa"
